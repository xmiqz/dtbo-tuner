name: Build Windows EXE

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller

      - name: Build with PyInstaller (onedir)
        run: pyinstaller DTBO-Tuner.spec --noconfirm --distpath dist --workpath build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: DTBO-Tuner
          path: dist/DTBO-Tuner
          if-no-files-found: error

      - name: Zip for release
        if: startsWith(github.ref, 'refs/tags/')
        run: Compress-Archive -Path dist/DTBO-Tuner -DestinationPath DTBO-Tuner.zip

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: DTBO-Tuner.zip
          generate_release_notes: true
